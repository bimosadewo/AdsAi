[project]
name = "google-ads-mcp"
version = "0.9.0"
description = "AdsAi: MCP server & otomasi laporan/alert Google Ads untuk agensi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-ads>=33.0.0",
    "mcp>=2.0",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
google-ads-mcp = "gads_mcp.server:main"
adsai = "gads_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gads_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
