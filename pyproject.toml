[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "MCP server untuk membaca dan mengaudit akun Google Ads dari Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-ads>=33.0.0",
    "mcp>=2.0",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
google-ads-mcp = "gads_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gads_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
